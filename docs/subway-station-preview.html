<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi · Subway pavilion</title><style>body{margin:0;background:#ede9df;color:#4d493f;font:16px system-ui}header{position:absolute;top:32px;left:48px;pointer-events:none}small{letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font-size:36px;font-weight:550;margin:9px 0}p{color:#787568;font-size:14px}canvas{display:block}footer{position:absolute;bottom:28px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between}button{border:1px solid #c7c3b5;border-radius:20px;padding:10px 17px;background:#faf8f0;color:#4d493f;cursor:pointer}</style></head><body><header><small>Komachi / One-cell station</small><h1>Down to the subway.</h1><p>Open stairs · kawara hip-and-gable roof · four independent light materials</p></header><footer><small>Drag to orbit · floor cutout and plinth are preview only</small><button id="night">Switch to night</button><button id="roof">Hide roof</button></footer><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.005,100);scene.background=new THREE.Color('#ede9df');camera.position.set(1.50,1.18,2.15);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.31,0);controls.update();
const hemi=new THREE.HemisphereLight('#fff9ea','#a8b7ac',2.5);scene.add(hemi);const sun=new THREE.DirectionalLight('#fff4de',3.5);sun.position.set(-3,7,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:.1,far:15});sun.shadow.normalBias=.0006;scene.add(sun);
const gltf=await new GLTFLoader().loadAsync('/assets/subway-station/komachi-subway-station.glb'),model=gltf.scene;scene.add(model);model.position.y=.12;model.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});
const groundMat=new THREE.MeshStandardMaterial({color:'#ede9df',roughness:1});
// Four ground quadrants leave a real cutout. No preview plane masks the descending treads.
function slab(w,d,x,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),groundMat);mesh.position.set(x,.06,z);mesh.receiveShadow=true;scene.add(mesh);}
slab(.26,1,-.37,0);slab(.26,1,.37,0);slab(.48,.13,0,.435);slab(.48,.15,0,-.425);
const shape=new THREE.Shape();shape.moveTo(-20,-20);shape.lineTo(20,-20);shape.lineTo(20,20);shape.lineTo(-20,20);shape.closePath();const hole=new THREE.Path();hole.moveTo(-.5,-.5);hole.lineTo(-.5,.5);hole.lineTo(.5,.5);hole.lineTo(.5,-.5);hole.closePath();shape.holes.push(hole);const ground=new THREE.Mesh(new THREE.ShapeGeometry(shape),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.005;ground.receiveShadow=true;scene.add(ground);
const lightNames=['Window_Band','Name_Board','Lamp_L','Lamp_R'];let night=false;
function render(){renderer.render(scene,camera);}
function setNight(value){night=value;document.querySelector('header p').style.color=night?'#bac5bf':'#787568';document.body.style.color=night?'#f7efe2':'#4d493f';groundMat.color.set(night?'#6d7d80':'#ede9df');hemi.intensity=night?.30:2.5;sun.intensity=night?.45:3.5;scene.background.set(night?'#3a4b52':'#ede9df');for(const name of lightNames){const mat=model.getObjectByName(name).material;mat.emissive.set(night?'#ffd08a':'#000000');mat.emissiveIntensity=night?1.4:0;}document.querySelector('#night').textContent=night?'Switch to day':'Switch to night';render();}
document.querySelector('#night').onclick=()=>setNight(!night);document.querySelector('#roof').onclick=()=>{const roof=model.getObjectByName('Kawara_Hip_And_Gable_Roof'),frame=model.getObjectByName('Eaves_And_Ceiling');roof.visible=!roof.visible;frame.visible=roof.visible;document.querySelector('#roof').textContent=roof.visible?'Hide roof':'Show roof';render();};
controls.addEventListener('change',render);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});render();window.stationPreview={scene,camera,renderer,controls,model,setNight,render};
</script></body></html>
