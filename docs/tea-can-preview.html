<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi · Tea break</title>
<style>body{margin:0;background:#ede9df;color:#4d493f;font:16px system-ui}header{position:absolute;top:35px;left:48px;pointer-events:none}small{letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font-size:36px;font-weight:550;margin:9px 0}p{color:#787568;font-size:14px}canvas{display:block}footer{position:absolute;bottom:28px;left:48px;right:48px;display:flex;justify-content:space-between}button{border:1px solid #c7c3b5;border-radius:20px;padding:10px 17px;background:#faf8f0;color:inherit;cursor:pointer}</style></head>
<body><header><small>Komachi / Everyday carry</small><h1>A little tea break.</h1><p>Sage green, a cream tea sticker, and a silver pull tab.</p></header><footer><small>Original low-poly prop · drag to orbit</small><button id="view">Show drinking character</button></footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createTeaCan} from '/src/tea-can.js';import {characterReady,attachCharacter,holdItem,updateCharacters} from '/src/characters.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#ede9df');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.001,100);camera.position.set(.12,.085,.22);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.028,0);controls.enableDamping=true;controls.update();scene.add(new THREE.HemisphereLight('#fff9ea','#a8b7ac',2.5));const light=new THREE.DirectionalLight('#fff4de',3.5);light.position.set(-1,3,2);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-.5,right:.5,top:.5,bottom:-.5,near:.01,far:8});light.shadow.normalBias=.0002;scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#ede9df',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const can=createTeaCan();can.position.y=.035;scene.add(can);
await characterReady;const grp=new THREE.Group();grp.visible=false;grp.userData.res={state:'inside'};scene.add(grp);const char=attachCharacter(grp,{name:'Mei',skin:'#e9c2a0',shirt:'#7f9b7a',pants:'#5f6772',hair:'#6b4c3a'});holdItem(char,createTeaCan());char.pose='drink';
let character=false,paused=false;
function showCharacter(){character=!character;can.visible=!character;grp.visible=character;camera.position.set(...(character?[.28,.32,.72]:[.12,.085,.22]));controls.target.set(0,character?.17:.028,0);controls.update();document.querySelector('#view').textContent=character?'Show can':'Show drinking character';}
document.querySelector('#view').onclick=showCharacter;
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(!paused)updateCharacters(Math.min(dt,.05));controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});window.teaPreview={scene,camera,renderer,controls,char,can,showCharacter,pause:()=>paused=true};
</script></body></html>
