<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi · Shiba study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#ede9df;color:#4d493f;font:16px system-ui}header{position:absolute;top:40px;left:48px;pointer-events:none}small{letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font-size:38px;font-weight:550;margin:9px 0}p{color:#787568;font-size:14px}canvas{display:block}footer{position:absolute;bottom:30px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between}button,select{border:1px solid #c7c3b5;border-radius:20px;padding:10px 17px;background:#faf8f0;color:inherit;cursor:pointer}nav{display:flex;gap:8px}</style></head>
<body><header><small>Komachi / Character study 03</small><h1>The neighbourhood Shiba.</h1><p>Pointed ears. Cream socks. One very proud curled tail.</p></header><footer><small>Original low-poly model · drag to orbit</small><nav><select id="motion"><option value="idle">Idle</option><option value="walk">Walk</option><option value="sit">Sit</option><option value="sniff">Sniff</option></select><button id="export">Download GLB</button></nav></footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';import {createDog,dogClips} from '../src/dogs.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#ede9df');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(3.7,2.45,5.5);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.55,0);controls.enableDamping=true;controls.update();scene.add(new THREE.HemisphereLight('#fff9ea','#a8b7ac',2.5));const light=new THREE.DirectionalLight('#fff4de',3.5);light.position.set(-3,6,4);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-5,right:5,top:5,bottom:-5});light.shadow.normalBias=.025;scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#ede9df',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-.015;scene.add(floor);
const dog=createDog(undefined,1);scene.add(dog);const clips=dogClips(),mixer=new THREE.AnimationMixer(dog);let action;function play(name){mixer.stopAllAction();action=mixer.clipAction(clips.find(c=>c.name===name));action.reset().setLoop(name==='sit'?THREE.LoopOnce:THREE.LoopRepeat,Infinity);action.clampWhenFinished=name==='sit';action.play();}play('idle');document.querySelector('#motion').onchange=e=>play(e.target.value);
document.querySelector('#export').onclick=async()=>{const data=await new GLTFExporter().parseAsync(createDog(),{binary:true,animations:dogClips()});const url=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download='komachi-shiba.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{mixer.update(Math.min(clock.getDelta(),.05));controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});window.dogPreview={dog,mixer,play,scene,camera,renderer,controls};
</script></body></html>
