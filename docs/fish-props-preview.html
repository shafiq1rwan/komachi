<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi fish props</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f2e9;color:#394c45;font-family:"Segoe UI",sans-serif}header{padding:30px 40px 0;position:relative;z-index:1;pointer-events:none}header small{font-size:11px;font-weight:700;letter-spacing:3px;color:#5f8580}h1{font-size:32px;margin:7px 0}header p{font-size:14px;color:#748076;margin:0}canvas{position:absolute;top:0;left:0;width:100%;height:100%}#labels{position:absolute;bottom:42px;left:32px;right:32px;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;pointer-events:none}#labels b{display:block;font-size:16px}#labels small{display:block;font-size:12px;color:#748076;margin-top:7px}</style></head>
<body><header><small>KOMACHI / PROP COLLECTION</small><h1>Fresh from the quay.</h1><p>Five fish · sculpted silhouettes · animated tails · ready for the catch and the market</p></header><div id="labels"></div>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
const kinds = ['sardine','horse-mackerel','flounder','rockfish','sea-bream'], names = ['Sardine','Horse mackerel','Flounder','Rockfish','Sea bream'], details = ['Slender silver body','Blue back · forked tail','Flat body · mottled back','Spiny dorsal fin','Rose scales · deep body'];
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-.68,.68,.68*innerHeight/innerWidth,-.68*innerHeight/innerWidth,.01,10);
camera.position.set(.09,.35,.8);camera.lookAt(0,.02,0);
scene.add(new THREE.HemisphereLight('#fff9ec','#c2d6cf',2.3));const light=new THREE.DirectionalLight('#fff1db',3);light.position.set(-.5,1,.6);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-1;light.shadow.camera.right=1;light.shadow.camera.top=1;light.shadow.camera.bottom=-1;light.shadow.bias=-.0005;scene.add(light);

for(let i=0;i<kinds.length;i++){

</script></body></html>
