<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi Maru · Island ferry</title>
<style>body{margin:0;background:#e8eee8;color:#465750;font:14px system-ui}header{position:absolute;left:40px;top:30px}small{letter-spacing:.2em;font-size:10px;text-transform:uppercase}h1{font-weight:500;font-size:34px;margin:10px 0}p{color:#78847d}footer{position:absolute;bottom:25px;left:40px;right:40px;display:flex;gap:10px;align-items:center}button{padding:10px 18px;border:1px solid #b8cbc5;border-radius:22px;background:#f6f8f1;color:inherit;cursor:pointer}footer small{margin-right:auto}canvas{display:block}</style>
<header><small>Komachi / Standalone island ro-ro</small><h1>小町丸 · Komachi Maru</h1><p>Open car deck · A small stern wheelhouse · Hinged bow ramp</p></header>
<footer><small>Drag to orbit · Scroll to zoom</small><button id="ramp">Lower ramp</button><button id="cars">Show three car slots</button><button id="water">Show keel</button><button id="rear">Stern view</button></footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e8eee8');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);const controls=new OrbitControls(camera,renderer.domElement);
scene.add(new THREE.HemisphereLight('#fff9ee','#a1b5ba',2.2));const sun=new THREE.DirectionalLight('#fff4de',3);sun.position.set(-3,7,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4});sun.shadow.normalBias=.001;scene.add(sun);
const water=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#b7d8ea',roughness:.9}));water.rotation.x=-Math.PI/2;water.position.y=-.001;water.receiveShadow=true;scene.add(water);
const gltf=await new GLTFLoader().loadAsync('/assets/island-ferry/komachi-island-ferry.glb');const model=gltf.scene;scene.add(model);model.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});const root=model.getObjectByName('Komachi_Island_Ferry'),ramp=model.getObjectByName('Ramp');
// Preview-only 0.36m-in-game-unit kei silhouettes; never included in the exported asset.
const cars=new THREE.Group();cars.visible=false;scene.add(cars);
for(let i=0;i<3;i++){const car=new THREE.Group();car.position.set(0,.24,.72-i*.42);cars.add(car);const bodyMat=new THREE.MeshStandardMaterial({color:['#e9b7b0','#a9d3c4','#f3e6cf'][i],roughness:.95});
function cube(w,h,d,x,y,z,mat=bodyMat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;car.add(m);}
cube(.20,.075,.36,0,.066,0);cube(.175,.085,.21,0,.145,-.027);cube(.15,.06,.004,0,.15,.08,new THREE.MeshStandardMaterial({color:'#a7c7d9'}));
for(const x of [-.097,.097])for(const z of [-.11,.11]){const m=new THREE.Mesh(new THREE.CylinderGeometry(.036,.036,.025,10),new THREE.MeshStandardMaterial({color:'#5f6772'}));m.rotation.z=Math.PI/2;m.position.set(x,.036,z);car.add(m);}}
function render(){renderer.render(scene,camera);}
function view(rear=false){camera.position.set(rear?-2.8:3.05,2.25,rear?-3.9:3.7);controls.target.set(0,.26,.12);controls.update();render();}
function setRamp(open){ramp.rotation.x=open?0:-Math.PI/2;document.querySelector('#ramp').textContent=open?'Raise ramp':'Lower ramp';render();}
document.querySelector('#ramp').onclick=()=>setRamp(ramp.rotation.x!==0);document.querySelector('#cars').onclick=()=>{cars.visible=!cars.visible;render();};document.querySelector('#water').onclick=()=>{water.visible=!water.visible;render();};let rear=false;document.querySelector('#rear').onclick=()=>{rear=!rear;view(rear);};controls.addEventListener('change',render);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});view();window.ferryPreview={model,root,ramp,cars,water,scene,renderer,camera,controls,render,view,setRamp};
</script></html>
