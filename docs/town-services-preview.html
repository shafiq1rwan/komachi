<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi · Town services</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ede9df;color:#474e49;font:14px system-ui}header{position:absolute;top:34px;left:42px;pointer-events:none}small{font-size:10px;letter-spacing:.22em;text-transform:uppercase}h1{font-size:35px;font-weight:500;letter-spacing:-.04em;margin:10px 0}p{color:#77796f;line-height:1.6;max-width:650px}canvas{display:block}footer{position:absolute;bottom:28px;left:42px;right:42px;display:flex;justify-content:space-between;gap:16px;align-items:center}select,button{border:1px solid #c8c7b9;border-radius:20px;background:#f9f6ed;color:#474e49;padding:10px 16px;font:inherit;cursor:pointer}.label{position:absolute;text-align:center;transform:translate(-50%,-50%);pointer-events:none}.label small{display:block;letter-spacing:.04em;color:#808378;font-size:10px;margin-top:6px}nav{display:flex;gap:8px}@media(max-width:700px){header{left:20px;top:20px}h1{font-size:26px}footer{left:20px;right:20px;flex-wrap:wrap}footer>small{display:none}}
</style></head><body>
<header><small>Komachi / Standalone model collection</small><h1 id="title">Places that look after the town.</h1><p id="description">A town hall, a neighbourhood clinic, a little fire station and a place for shared stories.</p></header>
<footer><small>Drag to orbit · Scroll to zoom · +Z front</small><nav><button id="rear">Rear view</button><button id="detail" hidden>Show detail</button><select id="model" aria-label="Model"><option value="all">Complete collection</option></select></nav></footer>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const names={'town-hall':'Town hall · 役場','clinic':'Neighbourhood clinic','fire-station':'Fire station','kei-fire-truck':'Kei fire truck','community-centre':'Community centre'};
const descriptions={'town-hall':'Two cells · Front clock, municipal flag and a sheltered porch for the newcomer.','clinic':'One cell · Green plus, mint awning and separate sliding-door panels.','fire-station':'One cell · Open garage bay with a removable kei fire truck.','kei-fire-truck':'Separate vehicle · Pump, coiled hose, ladder, light bar and four pivoted wheels.','community-centre':'One cell · Timber porch, bench and a town chronicle display.'};
const scene=new THREE.Scene();scene.background=new THREE.Color('#ede9df');
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
scene.add(new THREE.HemisphereLight('#fff9ee','#a8b7ac',2.1));
const light=new THREE.DirectionalLight('#fff4df',3.2);light.position.set(-3,7,5);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:.1,far:20});light.shadow.normalBias=.002;scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#ede9df',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.005;floor.receiveShadow=true;scene.add(floor);
const manifest=await(await fetch('/assets/town-services/manifest.json')).json(),models=[];
for(const entry of manifest){const gltf=await new GLTFLoader().loadAsync(`/assets/town-services/${entry.file}`);const mesh=gltf.scene;mesh.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});const wrap=new THREE.Group();wrap.add(mesh);scene.add(wrap);const label=document.createElement('span');label.className='label';label.innerHTML=`${names[entry.kind]}<small>${entry.kind==='town-hall'?'TWO CELLS':entry.kind==='kei-fire-truck'?'SEPARATE VEHICLE':'ONE CELL'}</small>`;document.body.appendChild(label);models.push({...entry,mesh,wrap,label});document.querySelector('#model').add(new Option(names[entry.kind],entry.kind));}
let activeKind='all',rear=false,detail=false;
const layout=[[-1.25,-1.3],[1.1,-1.3],[-1.5,1.35],[0,1.35],[1.45,1.35]];
function resetDetails(){for(const o of models){const truck=o.mesh.getObjectByName('Parked_Kei_Fire_Truck');if(truck)truck.visible=true;for(const side of ['Left','Right']){const leaf=o.mesh.getObjectByName(`Clinic_Sliding_Door_${side}`);if(leaf)leaf.position.x=side==='Left'?-.214:-.066;}}}
function select(kind='all',back=false){activeKind=kind;rear=back;detail=false;resetDetails();document.querySelector('#model').value=kind;document.querySelector('#title').textContent=kind==='all'?'Places that look after the town.':names[kind];document.querySelector('#description').textContent=descriptions[kind]??'A town hall, a neighbourhood clinic, a little fire station and a place for shared stories.';const button=document.querySelector('#detail');button.hidden=!['clinic','fire-station'].includes(kind);button.textContent=kind==='clinic'?'Slide doors open':'Show empty bay';document.querySelector('#rear').textContent=rear?'Front view':'Rear view';
for(const [i,o]of models.entries()){o.wrap.visible=kind==='all'||kind===o.kind;o.label.hidden=kind!=='all';o.wrap.scale.setScalar(kind==='all'?1:1.55/Math.max(...o.size));o.wrap.position.set(kind==='all'?layout[i][0]:0,0,kind==='all'?layout[i][1]:0);}
const selected=models.find(o=>o.kind===kind),height=selected?selected.size[1]*selected.wrap.scale.x:0;
controls.target.set(0,kind==='all'?.15:height*.40,0);camera.position.set(...(kind==='all'?[3.25,5.2,7.5]:[rear?-2.5:2.5,1.95,rear?-3.6:3.6]));controls.update();render();}
function showDetail(){detail=!detail;const o=models.find(o=>o.kind===activeKind);if(activeKind==='clinic'){for(const side of ['Left','Right']){const leaf=o.mesh.getObjectByName(`Clinic_Sliding_Door_${side}`);leaf.position.x=(side==='Left'?-.214:-.066)+(detail?leaf.userData.openOffset[0]:0);}document.querySelector('#detail').textContent=detail?'Close doors':'Slide doors open';}if(activeKind==='fire-station'){o.mesh.getObjectByName('Parked_Kei_Fire_Truck').visible=!detail;document.querySelector('#detail').textContent=detail?'Park truck':'Show empty bay';}render();}
function render(){for(const o of models)if(!o.label.hidden){const v=o.wrap.position.clone().add(new THREE.Vector3(0,-.035,o.size[2]/2+.14)).project(camera);o.label.style.left=(v.x*.5+.5)*innerWidth+'px';o.label.style.top=(-v.y*.5+.5)*innerHeight+'px';}renderer.render(scene,camera);}
document.querySelector('#model').onchange=e=>select(e.target.value);document.querySelector('#rear').onclick=()=>select(activeKind,!rear);document.querySelector('#detail').onclick=showDetail;controls.addEventListener('change',render);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});select();window.townServicesPreview={scene,camera,renderer,controls,models,select,showDetail,render};
</script></body></html>
