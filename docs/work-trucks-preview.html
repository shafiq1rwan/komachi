<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi · Civic kit</title>
<style>body{margin:0;background:#ede9df;color:#4d493f;font:16px system-ui}header{position:absolute;top:32px;left:48px;pointer-events:none}small{letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font-size:36px;font-weight:550;margin:9px 0}p{color:#787568;font-size:14px}canvas{display:block}footer{position:absolute;bottom:28px;left:48px;right:48px;display:flex;gap:16px;align-items:center;justify-content:space-between}select{border:1px solid #c7c3b5;border-radius:20px;padding:10px 17px;background:#faf8f0;color:inherit;cursor:pointer}.label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:14px;color:#635e52;text-align:center}.label small{display:block;font-size:10px;margin-top:5px;letter-spacing:.03em}</style></head>
<body><header><small>Komachi / Original low-poly models</small><h1 id="title">Civic kit</h1><p id="description">Small landmarks for a shared town.</p></header><footer><small>Drag to orbit · gallery models enlarged individually for detail</small><select id="kit" aria-label="Kit"><option value="trucks">Work trucks</option></select><select id="model" aria-label="Model"></select></footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const names={'kei-farm':'Farm keitora','builder':'Builder crane truck','fish-van':'Refrigerated fish van'};
const descriptions={trucks:['Village work trucks','A farm keitora, a folding-crane flatbed and an insulated fish van.']};
const scene=new THREE.Scene();scene.background=new THREE.Color('#ede9df');
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.005,100);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;
scene.add(new THREE.HemisphereLight('#fff9ea','#a8b7ac',2.5));const light=new THREE.DirectionalLight('#fff4de',3.5);light.position.set(-3,7,4);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:.1,far:15});light.shadow.normalBias=.001;scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#ede9df',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.007;floor.receiveShadow=true;scene.add(floor);
const manifest=await(await fetch('/assets/work-trucks/manifest.json')).json(),models=[];
for(const entry of manifest){const gltf=await new GLTFLoader().loadAsync(`/assets/work-trucks/komachi-${entry.kind}.glb`);const mesh=gltf.scene;mesh.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});const wrap=new THREE.Group();wrap.add(mesh);scene.add(wrap);const label=document.createElement('span');label.className='label';label.innerHTML=`${names[entry.kind]}<small>${entry.triangles.toLocaleString()} triangles</small>`;document.body.appendChild(label);models.push({...entry,mesh,wrap,label});}
let activeKit='trucks',activeKind='all';
function select(kind='all',rear=false){activeKind=kind;document.querySelector('#model').value=kind;document.querySelector('#title').textContent=kind==='all'?'Village work trucks':names[kind];const entries=models.filter(o=>o.kit===activeKit),single=models.find(o=>o.kind===kind);for(const o of models){o.wrap.visible=o.kit===activeKit&&(kind==='all'||o.kind===kind);o.label.hidden=!o.wrap.visible||kind!=='all';if(!o.wrap.visible)continue;const n=entries.indexOf(o),width=Math.max(o.size[0],o.size[2]),scale=.65/Math.max(width,o.size[1]);o.wrap.scale.setScalar(scale);o.wrap.position.set(kind==='all'?(n%4-(Math.min(entries.length,4)-1)/2)*1.05:0,0,kind==='all'?(Math.floor(n/4)-(entries.length>4?.5:0))*1.55:0);if(o.kind==='bicycle')o.mesh.rotation.y=Math.PI/2;}
const dims=single?single.size:null;camera.position.set(...(kind==='all'?[2.1,1.7,3.4]:[rear?-1.35:1.35,1.15,rear?-1.9:1.9]));controls.target.set(0,kind==='all'?.2:(dims?Math.min(.4,dims[1]/Math.max(...dims)*.38):.3),0);controls.update();render();}
function setKit(kit){activeKit=kit;document.querySelector('#kit').value=kit;const [title,desc]=descriptions[kit];document.querySelector('#title').textContent=title;document.querySelector('#description').textContent=desc;document.querySelector('#model').innerHTML='<option value="all">Complete kit</option>'+models.filter(o=>o.kit===kit).map(o=>`<option value="${o.kind}">${names[o.kind]}</option>`).join('');select();}
function render(){for(const o of models)if(!o.label.hidden){const p=o.wrap.position.clone().add(new THREE.Vector3(0,-.02,.46)).project(camera);o.label.style.left=(p.x*.5+.5)*innerWidth+'px';o.label.style.top=(-p.y*.5+.5)*innerHeight+'px';}renderer.render(scene,camera);}
document.querySelector('#kit').onchange=e=>setKit(e.target.value);document.querySelector('#model').onchange=e=>select(e.target.value);controls.addEventListener('change',render);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});setKit('trucks');window.kitPreview={scene,camera,renderer,controls,models,setKit,select,render,get activeKind(){return activeKind;}};
</script></body></html>
