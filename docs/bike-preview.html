<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi · City bicycle</title>
<style>*{box-sizing:border-box}body{margin:0;background:#ede9df;color:#4d493f;font:16px system-ui}header{position:absolute;top:40px;left:48px;pointer-events:none}small{letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font-size:38px;font-weight:550;margin:9px 0}p{color:#787568;font-size:14px}canvas{display:block}footer{position:absolute;bottom:30px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between}button,select{border:1px solid #c7c3b5;border-radius:20px;padding:10px 17px;background:#faf8f0;color:inherit;cursor:pointer}nav{display:flex;gap:8px}</style></head>
<body><header><small>Komachi / Vehicle study 01</small><h1>A bicycle for everyday errands.</h1><p>A low frame, a little basket, and the long way home.</p></header><footer><small>Original low-poly model · drag to orbit</small><nav><select id="color" aria-label="Frame colour"><option value="#6f9a96">Sage teal</option><option value="#d98b7a">Dusty rose</option><option value="#8fb0c9">Soft blue</option><option value="#f3e6cf">Cream</option></select><button id="motion">Start wheels</button><button id="export">Download GLB</button></nav></footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';import {createBike,rollBike,bikeClips} from '/src/bikes.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#ede9df');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);camera.position.set(.65,.42,.67);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.125,0);controls.enableDamping=true;controls.update();scene.add(new THREE.HemisphereLight('#fff9ea','#a8b7ac',2.5));const light=new THREE.DirectionalLight('#fff4de',3.5);light.position.set(-1,2,1);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-.5,right:.5,top:.5,bottom:-.5,near:.01,far:5});light.shadow.normalBias=.001;scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#ede9df',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.y=-.001;scene.add(floor);
let bike=createBike(),moving=false;scene.add(bike);document.querySelector('#color').onchange=e=>{scene.remove(bike);const materials=new Set();bike.traverse(o=>{if(o.isMesh){o.geometry.dispose();materials.add(o.material);}});materials.forEach(m=>m.dispose());bike=createBike(e.target.value);scene.add(bike);window.bikePreview.bike=bike;};
document.querySelector('#motion').onclick=e=>{moving=!moving;e.target.textContent=moving?'Stop wheels':'Start wheels';};
document.querySelector('#export').onclick=async()=>{const data=await new GLTFExporter().parseAsync(createBike(document.querySelector('#color').value),{binary:true,animations:bikeClips()});const url=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download='komachi-city-bicycle.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(moving)rollBike(bike,dt*.22);controls.update();renderer.render(scene,camera);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});window.bikePreview={bike,scene,camera,renderer,controls};
</script></body></html>
