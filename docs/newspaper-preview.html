<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komachi · Folded newspaper</title>
<style>body{margin:0;background:#ede9df;color:#4d493f;font:16px system-ui}header{position:absolute;top:35px;left:48px;pointer-events:none}small{letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font-size:36px;font-weight:550;margin:9px 0}p{color:#787568;font-size:14px}canvas{display:block}footer{position:absolute;bottom:28px;left:48px;right:48px;display:flex;justify-content:space-between}button{border:1px solid #c7c3b5;border-radius:20px;padding:10px 17px;background:#faf8f0;color:inherit;cursor:pointer}</style></head>
<body><header><small>Komachi / Everyday carry</small><h1>The morning paper.</h1><p>Folded cream paper, layered edges and a Komachi front page.</p></header><footer><small>Original low-poly prop · drag to orbit</small><button id="view">Show back</button></footer>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#ede9df');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.001,100);camera.position.set(.14,.085,.32);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.update();scene.add(new THREE.HemisphereLight('#fff9ea','#a8b7ac',2.7));const light=new THREE.DirectionalLight('#fff4de',3);light.position.set(-1,3,2);scene.add(light);const model=(await new GLTFLoader().loadAsync('/assets/props/komachi-newspaper.glb')).scene;scene.add(model);
let rear=false;function render(){renderer.render(scene,camera);}function showBack(value){rear=value;camera.position.set(rear?-.14:.14,.085,rear?-.32:.32);controls.update();document.querySelector('#view').textContent=rear?'Show front':'Show back';render();}document.querySelector('#view').onclick=()=>showBack(!rear);controls.addEventListener('change',render);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});render();window.newspaperPreview={scene,camera,renderer,controls,model,showBack,render};
</script></body></html>
